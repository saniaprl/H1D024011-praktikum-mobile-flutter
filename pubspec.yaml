name: tokokita
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

# Dependencies aplikasi
dependencies:
  flutter:
    sdk: flutter

  # Icon untuk aplikasi Flutter
  cupertino_icons: ^1.0.8

  # Menyimpan token login dan user ID
  shared_preferences: ^2.0.17

  # Menghubungkan Flutter dengan REST API
  # Digunakan untuk GET, POST, dan DELETE
  http: ^1.6.0

# Dependencies untuk pengembangan dan testing
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

# Konfigurasi Flutter
flutter:
  uses-material-design: true

  # Tambahkan assets jika dibutuhkan
  # assets:
  #   - images/
